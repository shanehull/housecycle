name: Test

on:
  pull_request:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'

permissions:
  contents: read

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
      - run: go test ./...
